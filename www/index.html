<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <link rel="stylesheet" href="style.css">
  <title>Leitor Office</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon">O</span><div><strong>Leitor Office</strong><small>Funciona 100% offline</small></div></div>
  </header>

  <main>
    <section id="home" class="welcome">
      <div class="eyebrow">SEU ESCRITÓRIO NO TABLET</div>
      <h1>Abra seus arquivos<br><span>Word e PowerPoint.</span></h1>
      <p>Visualize documentos e apresentações direto no aparelho, sem internet e sem servidor.</p>

      <label class="dropzone" for="fileInput" id="dropzone">
        <span class="upload-icon">↑</span>
        <strong>Toque para escolher um arquivo</strong>
        <span>ou arraste o arquivo para esta área</span>
        <small>DOCX · PPTX · até 80 MB</small>
      </label>
      <input id="fileInput" type="file">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="privacy"><span>🔒</span> Tudo é processado no seu aparelho. Nada é enviado para a internet.</div>
    </section>

    <section id="reader" class="reader hidden">
      <div class="readerbar">
        <div class="filetitle"><span class="filebadge" id="badge">DOC</span><strong id="filename">Documento</strong></div>
        <div class="reader-actions">
          <button id="zoomOut" type="button" class="secondary" aria-label="Diminuir">−</button>
          <button id="zoomFit" type="button" class="secondary">Ajustar</button>
          <button id="zoomIn" type="button" class="secondary" aria-label="Aumentar">+</button>
          <button id="newFile" type="button" class="primary">Abrir outro</button>
        </div>
      </div>
      <div id="viewer" class="viewer"><div id="host"></div></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
